repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-yaml
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: check-merge-conflict
    - id: check-toml
    - id: mixed-line-ending
    - id: check-json
    - id: pretty-format-json
      args: ["--autofix"]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
    - id: codespell
  - repo: https://github.com/DevinR528/cargo-sort
    rev: v2.1.3
    hooks:
      - id: cargo-sort
        args: ["-w"]
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
    - id: fmt
    - id: cargo-check
    - id: clippy
      verbose: True
      args: ["--no-deps",
             "--all-targets",
             "--",
             "-A", "clippy::all",
             "-W", "clippy::clone_on_copy",
             "-W", "clippy::needless_borrow",
             "-W", "clippy::correctness",
             "-W", "clippy::suspicious",
             ]
  - repo: local
    hooks:
    - id: check-command-docs
      name: Check command docs
      entry: python tools/check_command_docs.py
      language: system
      pass_filenames: false
      files: ^(libsurfer/src/command_parser\.rs|docs/commands/README\.md|tools/check_command_docs\.py)$
  - repo: https://github.com/shssoichiro/oxipng
    rev: v10.1.1
    hooks:
    - id: oxipng
  - repo: local
    hooks:
    - id: check-config-docs
      name: Check config docs
      entry: python3 tools/check_theme_config_docs.py
      language: system
      pass_filenames: false
      files: ^(default_config\.toml|docs/configuration/config/README\.md)$
